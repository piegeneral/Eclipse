name: Eclipse

options:
  bundleIdPrefix: com.piegeneral
  deploymentTarget:
    iOS: "17.0"

targets:
  Eclipse:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piegeneral.eclipse
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"